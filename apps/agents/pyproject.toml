[project]
name = "careeros-agents"
version = "0.1.0"
description = "CareerOS AI Agent Service — LangGraph + PydanticAI"
requires-python = ">=3.12"

dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.10",
    "langchain-openai>=0.2.12",
    "langchain-anthropic>=0.3.3",
    "pydantic-ai>=0.0.14",
    "pydantic>=2.10.3",
    "anthropic>=0.40.0",
    "openai>=1.57.0",
    "groq>=0.11.0",
    "asyncpg>=0.30.0",
    "prisma>=0.15.0",
    "redis>=5.2.0",
    "bullmq>=0.3.4",
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "httpx>=0.28.1",
    "structlog>=24.4.0",
    "sentry-sdk>=2.19.1",
    "tenacity>=9.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "langsmith>=0.2.1",
    "numpy>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.3",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
